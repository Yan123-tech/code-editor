name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # This manifest declares swift-tools-version 6.4, so the runner needs Xcode 26.
      # macos-latest still ships an older default; select it explicitly.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test