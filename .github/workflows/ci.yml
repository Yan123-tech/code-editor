name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # macos-latest already ships the default Xcode; selecting a version by path is
      # brittle because runner images move it. Print it instead so a failure log says
      # which toolchain produced it.
      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test